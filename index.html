<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="min-h-screen">
  <!-- Landing -->
  <div id="landing" class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
    <h1 class="font-display font-extrabold text-6xl sm:text-8xl tracking-tight">Torview</h1>
    <p class="mt-3 text-muted text-lg">Search a torrent. Preview it in seconds.</p>
    <form id="landingForm" class="mt-10 w-full max-w-2xl flex gap-2">
      <input id="landingInput" type="text" placeholder="Search or paste a magnet link…" class="flex-1 min-w-0 px-5 py-4 rounded-xl bg-surface border border-border text-base placeholder:text-dim focus:outline-none focus:border-accent" />
      <button type="button" id="landingPlus" class="px-4 py-4 rounded-xl bg-surface border border-border hover:bg-surface-2 transition text-xl leading-none" title="Add .torrent file">+</button>
      <button type="submit" class="px-6 py-4 rounded-xl bg-accent text-bg font-semibold hover:brightness-110 transition">Go</button>
    </form>
  </div>

  <!-- Results -->
  <div id="results" class="hidden min-h-screen">
    <header class="sticky top-0 z-20 backdrop-blur-md bg-bg/70 border-b border-border">
      <div class="max-w-6xl mx-auto px-6 h-14 flex items-center gap-3">
        <button id="homeBtn" class="font-display font-bold text-xl hover:text-accent transition">Torview</button>
        <form id="searchForm" class="flex-1 flex gap-2">
          <input id="searchInput" type="text" placeholder="Search or paste a magnet link…" class="flex-1 min-w-0 px-4 py-2 rounded-lg bg-surface border border-border text-sm focus:outline-none focus:border-accent" />
          <button type="button" id="plusBtn" class="px-3 py-2 rounded-lg bg-surface border border-border text-sm hover:bg-surface-2 transition">+</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-accent text-bg text-sm font-semibold hover:brightness-110 transition">Search</button>
        </form>
      </div>
    </header>
    <main class="max-w-6xl mx-auto px-6 py-6 space-y-5">
      <section class="card-surface p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-display font-semibold text-sm">Search plugins</h3>
          <button id="toggleAllPlugins" class="text-xs text-muted hover:text-text transition">Toggle all</button>
        </div>
        <div id="pluginList" class="flex flex-wrap gap-2"></div>
      </section>

      <section class="card-surface overflow-hidden">
        <div class="px-4 py-3 border-b border-border flex items-center justify-between">
          <h3 class="font-display font-semibold text-sm">Results</h3>
          <span id="resultsCount" class="text-xs text-muted"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-surface-2/40">
              <tr id="tableHead"></tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-border"></tbody>
          </table>
        </div>
        <div id="emptyState" class="hidden p-8 text-center text-muted text-sm">No results. Try another query or enable more plugins.</div>
      </section>
    </main>
  </div>

  <!-- Preview modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-surface border border-border rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-auto">
      <div class="flex items-center justify-between gap-3 px-5 py-3 border-b border-border">
        <div id="modalTitle" class="font-display font-semibold truncate">Preview</div>
        <button id="modalClose" class="px-3 py-1.5 rounded-lg bg-surface-2 hover:bg-elevated text-sm transition">Close</button>
      </div>
      <div class="p-5 space-y-4">
        <video id="modalVideo" controls class="w-full rounded-lg bg-black" style="max-height:60vh"></video>
        <div class="progress-track"><div id="modalProgress" class="progress-fill"></div></div>
        <pre id="modalStatus" class="text-xs text-muted font-mono whitespace-pre-wrap m-0 leading-relaxed"></pre>
      </div>
    </div>
  </div>

  <input id="fileInput" type="file" accept=".torrent,application/x-bittorrent" hidden />
  <script type="module" src="/main.js"></script>
</body>
</html>
